# --------------------------
# Variables de configuración
# --------------------------

$domain=stxt.dev
$web_pages=../stxt-lang
$web_out=../stxt-dev
# The books of ../stxt-pdf-book: the "book" pipeline, out of sight in es/pdf-book/ (the book of
# stxt-pdf, book/) and es/layout-book/ (the layout book, layout-book/)
$book_root=../stxt-pdf-book

# ---------------------
# Ejecución de comandos
# ---------------------

main=copy_resources, copy_hashed, \
		copy_stxt_pages_en, copy_stxt_pages_es, \
		read_pages_es, read_pages_en,\
		read_langs, velocity_init, \
		lang_es, render_pages_es, \
		lang_en, render_pages_en, \
		replace_es,replace_en,\
		sitemap

clean=clean_out
init=copy_start

# The books of ../stxt-pdf-book, in $web_out/es/pdf-book/ and $web_out/es/layout-book/: not in
# sitemap.xml, noindex, linked from nowhere. Separate from "main" because ../stxt-pdf-book may be
# missing; generate.sh runs it after "main" when it is there. It uses the CSS and JS that "main"
# has just written. Each book is read into the same context keys (book, book_pages) and rendered
# before the next one is read.
book=read_langs, velocity_init, lang_es, \
		read_book_es, copy_book_images_es, render_book_es, \
		read_layout_book_es, copy_layout_book_images_es, render_layout_book_es

# --------
# Comandos
# --------

clean_out=DeleteDir
clean_out.dir=$web_out

copy_resources=CopyFiles
copy_resources.dir=./static
copy_resources.todir=$web_out
copy_resources.overwrite=true
copy_resources.filter=/**/*
copy_resources.exclude=/css/**,/js/**

# CSS y JS se publican con el hash de su contenido en el nombre (site.<hash>.css):
# las plantillas los referencian con $utils.assetPath(); ver CopyHashed.
copy_hashed=CopyHashed
copy_hashed.dir=./static
copy_hashed.todir=$web_out
copy_hashed.filter=/css/**,/js/**

copy_stxt_pages_en=CopyFiles
copy_stxt_pages_en.dir=$web_pages/en
copy_stxt_pages_en.todir=$web_out
copy_stxt_pages_en.overwrite=true

copy_stxt_pages_es=CopyFiles
copy_stxt_pages_es.dir=$web_pages/es
copy_stxt_pages_es.todir=$web_out/es
copy_stxt_pages_es.overwrite=true

read_pages_es=ReadStxt
read_pages_es.dir=$web_pages/es
read_pages_es.out=pages_es

read_pages_en=ReadStxt
read_pages_en.dir=$web_pages/en
read_pages_en.out=pages_en

read_langs=ReadProperties
read_langs.dir=./lang
read_langs.out=langs

velocity_init=VelocityInit
velocity_init.template_path=./templates

lang_es=InsertProperties
lang_es.lang=es
lang_es.out=nav_lang

render_pages_es=Velocity
render_pages_es.in=pages_es
render_pages_es.template=page.vm
render_pages_es.todir=$web_out/es

lang_en=InsertProperties
lang_en.lang=en
lang_en.out=nav_lang

render_pages_en=Velocity
render_pages_en.in=pages_en
render_pages_en.template=page.vm
render_pages_en.todir=$web_out

replace_es=ReplaceText
replace_es.dir=$web_out/es
replace_es.replace.@STXT@=<span class='stxt'>STXT</span>
replace_es.encoding=UTF-8
replace_es.filter=/*.html

replace_en=ReplaceText
replace_en.dir=$web_out
replace_en.replace.@STXT@=<span class='stxt'>STXT</span>
replace_en.encoding=UTF-8
replace_en.filter=/*.html

sitemap=Sitemap
sitemap.todir=$web_out
sitemap.domain=$domain
sitemap.pages=pages_es,pages_en
sitemap.prefix=/es,

# ---------
# The books
# ---------

# The book of stxt-pdf (book/), in es/pdf-book/

read_book_es=ReadBook
read_book_es.file=$book_root/book/es/book.stxt
read_book_es.template=$book_root/.stxt/dev.stxt.pdf.book.stxt
read_book_es.out=book
read_book_es.pages=book_pages

# The images of every chapter, flat next to the pages (ReadBook checks the names are unique)
copy_book_images_es=CopyFiles
copy_book_images_es.dir=$book_root/book/es
copy_book_images_es.todir=$web_out/es/pdf-book
copy_book_images_es.overwrite=true
copy_book_images_es.flatten=true
copy_book_images_es.filter=/**/*.png,/**/*.jpg,/**/*.svg

render_book_es=Velocity
render_book_es.in=book_pages
render_book_es.pages=book_pages
render_book_es.index=index
render_book_es.template=book/page.vm
render_book_es.todir=$web_out/es/pdf-book
# The base URL of the book ($bookPath in the templates), the only thing that differs between books
render_book_es.model.bookPath=/es/pdf-book/

# The layout book (layout-book/), in es/layout-book/: same format, template and pages
read_layout_book_es=ReadBook
read_layout_book_es.file=$book_root/layout-book/es/book.stxt
read_layout_book_es.template=$book_root/.stxt/dev.stxt.pdf.book.stxt
read_layout_book_es.out=book
read_layout_book_es.pages=book_pages

copy_layout_book_images_es=CopyFiles
copy_layout_book_images_es.dir=$book_root/layout-book/es
copy_layout_book_images_es.todir=$web_out/es/layout-book
copy_layout_book_images_es.overwrite=true
copy_layout_book_images_es.flatten=true
copy_layout_book_images_es.filter=/**/*.png,/**/*.jpg,/**/*.svg

render_layout_book_es=Velocity
render_layout_book_es.in=book_pages
render_layout_book_es.pages=book_pages
render_layout_book_es.index=index
render_layout_book_es.template=book/page.vm
render_layout_book_es.todir=$web_out/es/layout-book
render_layout_book_es.model.bookPath=/es/layout-book/
